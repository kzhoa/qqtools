[tox]
envlist = py311, py312, py313, py314, unit, integration, e2e, base, full, cleanup
skip_missing_interpreters = true

[testenv]
allowlist_externals =
    pytest
setenv =
    PYTHONPATH = {toxinidir}/src
passenv =
    USERNAME
    USER
deps =
    pytest
    pytest-cov
commands =
    pytest {posargs:tests/unit -q}


[testenv:unit]
commands =
    pytest {posargs:tests/unit -q}


[testenv:integration]
basepython = python3.13
usedevelop = true
deps =
    .[full]
commands =
    pytest {posargs:tests/integration --ignore=tests/integration/qexp -m "not slow and not gpu and not ddp" -q}


[testenv:qexp-unit]
skip_install = true
deps =
    pytest
    PyYAML
commands =
    pytest {posargs:tests/unit/qexp -q}


[testenv:qexp-integration]
basepython = python3.13
skip_install = true
deps =
    pytest
    PyYAML
commands =
    pytest {posargs:tests/integration/qexp -q}


# PR qexp gate: all deterministic unit tests plus integration tests that inject
# a per-test authority namespace and do not depend on host-global resources.
[testenv:qexp-fast]
basepython = python3.13
skip_install = true
deps =
    pytest
    PyYAML
commands =
    pytest tests/unit/qexp -q
    pytest tests/integration/qexp -m "hermetic and not machine_lab" -q


# Merge gate: real independently imported machine participants on one host.
[testenv:qexp-machine-lab]
basepython = python3.13
skip_install = true
deps =
    pytest
    PyYAML
commands =
    pytest {posargs:tests/integration/qexp -m machine_lab -q}


# Serial production-authority evidence. It skips locally if another qexp agent
# owns the default lock and fails in CI if the runner is polluted.
[testenv:qexp-host-exclusive]
basepython = python3.13
skip_install = true
deps =
    pytest
    PyYAML
commands =
    pytest {posargs:tests/integration/qexp -m host_exclusive -q}


# Release gate for the complete qexp source-level regression suite.
[testenv:qexp-full]
basepython = python3.13
skip_install = true
deps =
    pytest
    PyYAML
commands =
    pytest tests/unit/qexp -q
    pytest tests/integration/qexp -q


[testenv:e2e]
basepython = python3.13
usedevelop = true
deps =
    .[full]
commands =
    pytest {posargs:tests/e2e -m "not slow and not gpu and not ddp" -q}


# Base environment: validates core functionality with lightweight dependencies.
# Intended for quick unit verification.
[testenv:base]
basepython = python3.13
commands =
    python -c "import sys; print(f'Python {sys.version}')"
    python -c "import torch; print('Torch version:', torch.__version__)"
    pytest tests/unit -v --tb=long -W default

# Full environment: validates features that require optional/full dependency set.
# Intended for broader functional/integration verification.
[testenv:full]
basepython = python3.13
usedevelop = true
deps =
    .[full]
commands =
    python -c "import sys; print(f'Python {sys.version}')"
    pytest tests/functional -v


# Release-only end-to-end verification. This environment builds and installs a
# non-editable wheel; it intentionally uses a separate pytest configuration
# that does not add the repository's src/ directory to sys.path.
[testenv:release-e2e]
basepython = python3.13
package = wheel
usedevelop = false
extras = exp
setenv =
    PYTHONPATH =
    PIP_CACHE_DIR = {toxworkdir}/pip-cache
deps =
    pytest
commands =
    python -E -m pytest -c tests/e2e/release_pytest.ini {posargs:tests/e2e/qexp -q}

[testenv:cleanup]
basepython = python3.13
skip_install = true
deps =
commands =
    python -c "from pathlib import Path; import shutil; root = Path(r'{toxinidir}') / 'tmp'; root.mkdir(parents=True, exist_ok=True); [shutil.rmtree(p, ignore_errors=True) if p.is_dir() else p.unlink(missing_ok=True) for p in root.iterdir()]"
