[tox]
requires =
    tox==4.61.5
    tox-uv==1.36.0
    uv==0.12.16
envlist = preflight
skip_missing_interpreters = false

[testenv]
runner = uv-venv-runner
setenv =
    PYTHONPATH = {toxinidir}/src
passenv =
    USERNAME
    USER
    UV_DEFAULT_INDEX
    UV_INDEX_URL
    UV_INDEX
    UV_EXTRA_INDEX_URL
    UV_CACHE_DIR
    UV_LINK_MODE
    UV_NATIVE_TLS
    UV_SYSTEM_CERTS
    SSL_CERT_FILE
deps =
    pytest
commands =
    python -m pytest {posargs:tests/unit -q}


[testenv:unit]
basepython = python3.13
usedevelop = true
extras = full
deps =
    pytest
    pytest-xdist
commands =
    python -m pytest -o testpaths=tests/unit {posargs:-q}


[pkgenv]
runner = uv-venv-pep-517
passenv = {[testenv]passenv}


[testenv:qexp-integration]
basepython = python3.13
skip_install = true
deps =
    pytest
    pytest-xdist
    PyYAML
    libtmux
commands =
    python scripts/qexp_integration_gate.py --budget-seconds 600 {posargs}


# Merge gate: real independently imported machine participants on one host.
# Every lifecycle node owns independent temp/runtime/tmux/authority roots.  Run
# the whole lifecycle matrix in one bounded xdist phase; the gate still rejects
# missing, skipped, failed, or over-budget nodes.
[testenv:qexp-lifecycle-parallel]
basepython = python3.13
skip_install = true
deps =
    pytest
    pytest-xdist
    PyYAML
    libtmux
commands =
    python -m pytest --lifecycle-gate=full tests/integration/qexp/test_agent_lifecycle_independence.py -n 4 --dist load -q


# Local developer preflight. It intentionally installs the full project dependency
# set and does not constrain torch to CPU-only; a developer machine may provide a
# GPU-capable torch build. GitHub Actions uses a separate CPU-only bootstrap but
# runs the same scripts/ci/run_preflight.py command manifest.
[testenv:preflight]
basepython = python3.13
skip_install = true
deps = {[tox]requires}
commands =
    python -m tox run --workdir {toxworkdir} -e unit --override "testenv:unit.commands=python scripts/ci/run_preflight.py {posargs}"


# GitHub preflight execution shell. The workflow prepares the complete CPU-only
# environment in the base interpreter first. This tox environment installs no
# dependencies and only restores tox's isolated environment/passenv semantics
# while exposing the already-installed packages through system site-packages.
# Bound numerical thread pools to one thread: GitHub-hosted runners are small CPU
# machines, and later DataLoader/process tests must not inherit oversized math
# thread pools created earlier in the unit suite.
[testenv:preflight-ci]
basepython = python3.13
skip_install = true
sitepackages = true
setenv =
    {[testenv]setenv}
    OMP_NUM_THREADS = 1
    MKL_NUM_THREADS = 1
    OPENBLAS_NUM_THREADS = 1
    NUMEXPR_NUM_THREADS = 1
deps =
commands =
    python scripts/ci/run_preflight.py {posargs}


[testenv:artifact-e2e]
basepython = python3.13
package = wheel
usedevelop = false
extras = exp
setenv =
    PYTHONPATH =
deps =
    pytest
commands =
    python scripts/checks/check_test_lanes.py
    python scripts/checks/check_contract_matrix.py
    python -E -m pytest --installed-lifecycle-gate -c tests/e2e/installed_artifact_pytest.ini {posargs:tests/e2e -q}


[testenv:artifact-smoke]
deps =
package = wheel
usedevelop = false
extras = exp
setenv =
    PYTHONPATH =
commands =
    python -E -c "import qqtools; from pathlib import Path; path = Path(qqtools.__file__).resolve(); assert 'site-packages' in str(path), path"
    qexp --help


# Release-only exact-wheel verification. Pass --installpkg <wheel> to validate the
# artifact selected by the release workflow.
[testenv:release-e2e]
base = testenv:artifact-e2e
