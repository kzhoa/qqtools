[tox]
requires =
    tox==4.61.5
    tox-uv==1.36.0
    uv==0.12.16
envlist = py311, py312, py313, py314, unit, integration, preflight, artifact-e2e, cleanup
skip_missing_interpreters = true

[testenv]
runner = uv-venv-runner
allowlist_externals =
    pytest
setenv =
    PYTHONPATH = {toxinidir}/src
passenv =
    USERNAME
    USER
    UV_DEFAULT_INDEX
    UV_INDEX_URL
    UV_INDEX
    UV_EXTRA_INDEX_URL
    UV_CACHE_DIR
    UV_LINK_MODE
    UV_NATIVE_TLS
    UV_SYSTEM_CERTS
    SSL_CERT_FILE
deps =
    pytest
    pytest-cov
commands =
    pytest {posargs:tests/unit -q}


[testenv:unit]
usedevelop = true
extras = full
deps =
    pytest
    pytest-cov
    pytest-xdist
commands =
    python -m pytest -o testpaths=tests/unit {posargs:-q}


[pkgenv]
runner = uv-venv-pep-517
passenv = {[testenv]passenv}


[testenv:lint]
skip_install = true
deps =
    ruff
commands =
    ruff check src tests scripts
    ruff format --check src tests scripts


[testenv:integration]
basepython = python3.13
usedevelop = true
deps =
    .[full]
commands =
    pytest {posargs:tests/integration --ignore=tests/integration/qexp -m "not slow and not gpu and not ddp" -q}


[testenv:qexp-unit]
skip_install = true
deps =
    pytest
    PyYAML
commands =
    pytest {posargs:tests/unit/qexp -q}


[testenv:qexp-integration]
basepython = python3.13
skip_install = true
deps =
    pytest
    pytest-xdist
    PyYAML
    libtmux
commands =
    python scripts/qexp_integration_gate.py --budget-seconds 600 {posargs}


# Merge gate: real independently imported machine participants on one host.
[testenv:qexp-machine-lab]
basepython = python3.13
skip_install = true
deps =
    pytest
    PyYAML
commands =
    pytest {posargs:tests/integration/qexp -m machine_lab -q}


# Every lifecycle node owns independent temp/runtime/tmux/authority roots.  Run
# the whole lifecycle matrix in one bounded xdist phase; the gate still rejects
# missing, skipped, failed, or over-budget nodes.
[testenv:qexp-lifecycle-parallel]
basepython = python3.13
skip_install = true
deps =
    pytest
    pytest-xdist
    PyYAML
    libtmux
commands =
    pytest --lifecycle-gate=full tests/integration/qexp/test_agent_lifecycle_independence.py -n 4 --dist load -q


# Local developer preflight. It intentionally installs the full project dependency
# set and does not constrain torch to CPU-only; a developer machine may provide a
# GPU-capable torch build. GitHub Actions uses a separate CPU-only bootstrap but
# runs the same scripts/ci/run_preflight.py command manifest.
[testenv:preflight]
usedevelop = true
extras = full
deps =
    pytest-xdist
commands =
    python scripts/ci/run_preflight.py


# GitHub preflight execution shell. The workflow prepares the complete CPU-only
# environment in the base interpreter first. This tox environment installs no
# dependencies and only restores tox's isolated environment/passenv semantics
# while exposing the already-installed packages through system site-packages.
# Bound numerical thread pools to one thread: GitHub-hosted runners are small CPU
# machines, and later DataLoader/process tests must not inherit oversized math
# thread pools created earlier in the unit suite.
[testenv:preflight-ci]
skip_install = true
sitepackages = true
setenv =
    {[testenv]setenv}
    OMP_NUM_THREADS = 1
    MKL_NUM_THREADS = 1
    OPENBLAS_NUM_THREADS = 1
    NUMEXPR_NUM_THREADS = 1
deps =
commands =
    python scripts/ci/run_preflight.py


# Base environment: validates core functionality with lightweight dependencies.
# Intended for quick unit verification.
[testenv:base]
basepython = python3.13
commands =
    python -c "import sys; print(f'Python {sys.version}')"
    python -c "import torch; print('Torch version:', torch.__version__)"
    pytest tests/unit -v --tb=long -W default

[testenv:artifact-e2e]
basepython = python3.13
package = wheel
usedevelop = false
extras = exp
setenv =
    PYTHONPATH =
    PIP_CACHE_DIR = {toxworkdir}/pip-cache
deps =
    pytest
commands =
    python scripts/checks/check_test_lanes.py
    python scripts/checks/check_contract_matrix.py
    python -E -m pytest --installed-lifecycle-gate -c tests/e2e/installed_artifact_pytest.ini {posargs:tests/e2e -q}


[testenv:artifact-smoke]
package = wheel
usedevelop = false
extras = exp
setenv =
    PYTHONPATH =
commands =
    python -E -c "import qqtools; from pathlib import Path; path = Path(qqtools.__file__).resolve(); assert 'site-packages' in str(path), path"
    qexp --help


# Release-only exact-wheel verification. Pass --installpkg <wheel> to validate the
# artifact selected by the release workflow.
[testenv:release-e2e]
basepython = python3.13
package = wheel
usedevelop = false
extras = exp
setenv =
    PYTHONPATH =
    PIP_CACHE_DIR = {toxworkdir}/pip-cache
deps =
    pytest
commands =
    python scripts/checks/check_test_lanes.py
    python scripts/checks/check_contract_matrix.py
    python -E -m pytest --installed-lifecycle-gate -c tests/e2e/installed_artifact_pytest.ini {posargs:tests/e2e -q}

[testenv:cleanup]
basepython = python3.13
skip_install = true
deps =
commands =
    python -c "from pathlib import Path; import shutil; root = Path(r'{toxinidir}') / 'tmp'; root.mkdir(parents=True, exist_ok=True); [shutil.rmtree(p, ignore_errors=True) if p.is_dir() else p.unlink(missing_ok=True) for p in root.iterdir()]"
