[tox]
envlist = py311, py312, py313, py314, unit, integration, preflight, artifact-e2e, cleanup
skip_missing_interpreters = true

[testenv]
allowlist_externals =
    pytest
setenv =
    PYTHONPATH = {toxinidir}/src
passenv =
    USERNAME
    USER
deps =
    pytest
    pytest-cov
commands =
    pytest {posargs:tests/unit -q}


[testenv:unit]
commands =
    pytest {posargs:tests/unit -q}


[testenv:integration]
basepython = python3.13
usedevelop = true
deps =
    .[full]
commands =
    pytest {posargs:tests/integration --ignore=tests/integration/qexp -m "not slow and not gpu and not ddp" -q}


[testenv:qexp-unit]
skip_install = true
deps =
    pytest
    PyYAML
commands =
    pytest {posargs:tests/unit/qexp -q}


[testenv:qexp-integration]
basepython = python3.13
skip_install = true
deps =
    pytest
    PyYAML
commands =
    pytest {posargs:tests/integration/qexp -q}


# Merge gate: real independently imported machine participants on one host.
[testenv:qexp-machine-lab]
basepython = python3.13
skip_install = true
deps =
    pytest
    PyYAML
commands =
    pytest {posargs:tests/integration/qexp -m machine_lab -q}


# Release gate for the complete qexp source-level regression suite.
[testenv:qexp-full]
basepython = python3.13
skip_install = true
deps =
    pytest
    PyYAML
commands =
    pytest tests/unit/qexp -q
    pytest tests/integration/qexp -q


[testenv:preflight]
basepython = python3.13
usedevelop = true
deps =
    .[full]
commands =
    python scripts/checks/check_test_lanes.py
    python scripts/checks/check_contract_matrix.py
    pytest tests/unit -q
    pytest tests/integration --ignore=tests/integration/qexp -m "not slow and not gpu and not ddp" -q
    pytest tests/integration/qexp/test_resource_isolation.py -q
    pytest tests/integration/qexp/test_store_crash_boundaries.py -q
    pytest tests/integration/qexp/test_machine_lab.py -q


# Base environment: validates core functionality with lightweight dependencies.
# Intended for quick unit verification.
[testenv:base]
basepython = python3.13
commands =
    python -c "import sys; print(f'Python {sys.version}')"
    python -c "import torch; print('Torch version:', torch.__version__)"
    pytest tests/unit -v --tb=long -W default

[testenv:artifact-e2e]
basepython = python3.13
package = wheel
usedevelop = false
extras = exp
setenv =
    PYTHONPATH =
    PIP_CACHE_DIR = {toxworkdir}/pip-cache
deps =
    pytest
commands =
    python scripts/checks/check_test_lanes.py
    python scripts/checks/check_contract_matrix.py
    python -E -m pytest -c tests/e2e/installed_artifact_pytest.ini {posargs:tests/e2e -q}


[testenv:artifact-smoke]
package = wheel
usedevelop = false
extras = exp
setenv =
    PYTHONPATH =
commands =
    python -E -c "import qqtools; from pathlib import Path; path = Path(qqtools.__file__).resolve(); assert 'site-packages' in str(path), path"
    qexp --help


# Release-only exact-wheel verification. Pass --installpkg <wheel> to validate the
# artifact selected by the release workflow.
[testenv:release-e2e]
basepython = python3.13
package = wheel
usedevelop = false
extras = exp
setenv =
    PYTHONPATH =
    PIP_CACHE_DIR = {toxworkdir}/pip-cache
deps =
    pytest
commands =
    python scripts/checks/check_test_lanes.py
    python scripts/checks/check_contract_matrix.py
    python -E -m pytest -c tests/e2e/installed_artifact_pytest.ini {posargs:tests/e2e -q}

[testenv:cleanup]
basepython = python3.13
skip_install = true
deps =
commands =
    python -c "from pathlib import Path; import shutil; root = Path(r'{toxinidir}') / 'tmp'; root.mkdir(parents=True, exist_ok=True); [shutil.rmtree(p, ignore_errors=True) if p.is_dir() else p.unlink(missing_ok=True) for p in root.iterdir()]"
