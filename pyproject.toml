[project]
name = "qqtools"
description = "A small tool package for qq"
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
requires-python = ">=3.11"
authors = [{ name = "qq" }]
dependencies = ["torch", "PyYAML", "scipy", "rich"]

# note:
# scipy requires: numpy

[project.optional-dependencies]
# Optional plotting/data convenience dependencies. Core imports must not require
# either package; `full` retains the historical all-features installation.
data = ["matplotlib", "pandas"]
# optionally required by standard distribution
std = ["lmdb", "tqdm", "requests"]
plugins = ["rich", "scikit-learn", "prompt_toolkit"]
exp = ["libtmux>=0.62.0", "psutil", "nvidia-ml-py"]
dev = ["tox==4.61.5", "tox-uv==1.36.0", "uv==0.12.16", "pytest", "ruff", "build"]
# GitHub Dev Preflight dependency surface. Keep this explicit rather than
# inheriting `full`: CI needs LMDB/metrics/qcgen/qexp lifecycle coverage and
# pytest-xdist's hook specification for the lifecycle gate, but it does not need
# network download helpers, plotting/data convenience packages, NVML/psutil
# tooling, or package-build tooling.
ci-preflight = [
    "lmdb",
    "tqdm",
    "scikit-learn",
    "prompt_toolkit",
    "libtmux>=0.62.0",
    "tox==4.61.5",
    "tox-uv==1.36.0",
    "uv==0.12.16",
    "pytest",
    "pytest-xdist",
    "ruff",
]
full = [
    "qqtools[data]",
    "qqtools[std]",
    "qqtools[plugins]",
    "qqtools[exp]",
    "qqtools[dev]",
] # all optional dependencies


[project.urls]
Repository = "https://github.com/kzhoa/qqtools.git"


[project.scripts]
qread = "qqtools.cli.qread:main"
qcgen = "qqtools.cli.qcgen:main"
qexp = "qqtools.plugins.qexp.cli:main"

# === build settings ===
[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]
include = ["qqtools*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
qqtools = ["py.typed", "*.pyi", "**/*.pyi"]


[tool.setuptools.dynamic]
version = { attr = "qqtools.version.__version__" }

# === dev settings ===
[tool.ruff]
extend-include = ["scripts/dev"]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# Keep the lint gate limited to syntax and definite name-resolution errors.
# Formatting is enforced separately by `ruff format`; other stylistic
# refactors are intentionally not CI requirements.
select = ["E713", "E741", "E9", "F541", "F821", "F822", "F823", "F841", "I"]
# E731 is a stylistic preference; assigned lambdas are allowed in this project.

[tool.ruff.lint.isort]
# Match the legacy isort project's first-party module grouping.
known-first-party = ["qqtools", "tests", "scripts"]
# Legacy isort's Black profile folds a single imported member when it fits.
split-on-trailing-comma = false

[tool.ruff.format]
line-ending = "lf"
