name: qexp profiling

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qexp-full-profile:
    name: qexp full profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip tox
      - name: Run qexp full suite with timing
        run: |
          tox run -e qexp-integration --             --lifecycle-gate=full             --durations=100             --durations-min=0.01             -q
