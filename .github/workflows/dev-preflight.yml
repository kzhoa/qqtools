name: Dev Preflight

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  workflow_call:
    inputs:
      reuse_existing:
        description: Reuse the same dev commit's recent push preflight
        type: boolean
        default: false
      strip_dev_state:
        description: Remove feature-local .dev state before validating a promotion candidate
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  select-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      reused: ${{ steps.evidence.outputs.reused }}
    steps:
      - uses: actions/checkout@v7
      - name: Check exact-commit gate evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: preflight
          ALLOW_REUSE: ${{ inputs.reuse_existing && 'true' || 'false' }}
        run: python3 scripts/ci/reuse_gate.py

  preflight:
    needs: select-evidence
    if: needs.select-evidence.outputs.reused != 'true'
    name: CPU-only preflight (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Strip feature-local state from promotion candidate
        if: inputs.strip_dev_state
        run: rm -rf .dev

      - name: Set up Python 3.13 with pip cache
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # GitHub-hosted runners have no GPU. Install the CPU wheel first so the
      # project's unpinned `torch` dependency is already satisfied. CI then
      # installs only the dependency surface required by the shared preflight
      # gates. Local `tox -e preflight` intentionally keeps `.[full]` for
      # developer machines.
      - name: Install CPU-only preflight environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[ci-preflight]"
          python -c "import torch; assert torch.version.cuda is None, f'GitHub preflight must use CPU-only torch, got CUDA {torch.version.cuda}'"
          python -c "import libtmux, lmdb, prompt_toolkit, sklearn; print('required preflight dependencies available')"

      - name: Run shared preflight gates in CI tox shell
        run: python -m tox run -e preflight-ci

  gate-result:
    if: always()
    needs: [select-evidence, preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful evidence or fresh gates
        env:
          EVIDENCE_RESULT: ${{ needs.select-evidence.result }}
          REUSED: ${{ needs.select-evidence.outputs.reused }}
          FRESH_RESULTS: ${{ needs.preflight.result }}
        run: |
          set -euo pipefail
          [[ "$EVIDENCE_RESULT" == "success" ]] || exit 1
          if [[ "$REUSED" != "true" ]]; then
            [[ -n "$FRESH_RESULTS" ]] || exit 1
            for result in $FRESH_RESULTS; do
              [[ "$result" == "success" ]] || exit 1
            done
          fi
