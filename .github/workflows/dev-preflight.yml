name: Dev Preflight

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  workflow_call:
    inputs:
      reuse_existing:
        description: Reuse the same dev commit's recent push preflight
        type: boolean
        default: false
      strip_dev_state:
        description: Remove feature-local .dev state before validating a promotion candidate
        required: false
        type: boolean
        default: false
      profile:
        description: Validation profile (auto classifies dev pushes; feature or release selects explicitly)
        required: false
        type: string
        default: auto

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  classify_profile:
    name: Classify preflight profile
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.classify.outputs.profile }}
      base_ref: ${{ steps.classify.outputs.base_ref }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify release metadata
        id: classify
        env:
          REQUESTED_PROFILE: ${{ inputs.profile || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          HEAD_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$REQUESTED_PROFILE" in
            auto|feature|release) ;;
            *) echo "profile must be auto, feature, or release"; exit 1 ;;
          esac
          if [[ "$REQUESTED_PROFILE" == "release" ]]; then
            base_ref="$(git rev-parse HEAD^)"
            echo "profile=release" >> "$GITHUB_OUTPUT"
            echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          elif [[ "$REQUESTED_PROFILE" == "feature" ]]; then
            base_ref="$(git rev-parse HEAD^)"
            echo "profile=feature" >> "$GITHUB_OUTPUT"
            echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/dev" ]]; then
            python3 scripts/checks/check_release_commit.py classify \
              --base-ref "$EVENT_BEFORE" \
              --head-ref "$HEAD_REF" \
              --github-output "$GITHUB_OUTPUT"
          else
            base_ref="$(git rev-parse HEAD^)"
            echo "profile=feature" >> "$GITHUB_OUTPUT"
            echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          fi

  promotion-provenance:
    name: Trusted promotion provenance
    runs-on: ubuntu-latest
    outputs:
      attested: ${{ steps.verify.outputs.attested || 'false' }}
    steps:
      - name: Check out repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconstruct promotion subject
        id: candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          PREVIOUS_DEV_SHA: ${{ github.event.before }}
          PROVENANCE_PATH: ${{ runner.temp }}/qqtools-promotion-provenance.json
        run: |
          if ! python3 scripts/ci/promotion_provenance.py \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --expected-parent "$PREVIOUS_DEV_SHA" \
            --output "$PROVENANCE_PATH" \
            --github-output "$GITHUB_OUTPUT"
          then
            echo "No valid promotion provenance marker; complete preflight is required."
          fi

      - name: Verify GitHub promotion attestation
        id: verify
        if: steps.candidate.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_PATH: ${{ runner.temp }}/qqtools-promotion-provenance.json
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          SOURCE_REF: ${{ steps.candidate.outputs.source_ref }}
        run: |
          signer_workflow="$GITHUB_REPOSITORY/.github/workflows/repository-governance.yml"
          if gh attestation verify "$PROVENANCE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer_workflow" \
            --signer-digest "$SOURCE_SHA" \
            --source-digest "$SOURCE_SHA" \
            --source-ref "$SOURCE_REF" \
            --deny-self-hosted-runners
          then
            echo "attested=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Promotion attestation was not verified; running complete preflight."
            echo "attested=false" >> "$GITHUB_OUTPUT"
          fi

  select-evidence:
    needs: classify_profile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      reused: ${{ steps.evidence.outputs.reused }}
    steps:
      - uses: actions/checkout@v7
      - name: Check exact-commit gate evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ needs.classify_profile.outputs.profile == 'release' && 'release-preflight' || 'feature-preflight' }}
          ALLOW_REUSE: ${{ inputs.reuse_existing && 'true' || 'false' }}
        run: python3 scripts/ci/reuse_gate.py

  preflight:
    needs: [classify_profile, promotion-provenance, select-evidence]
    if: >-
      needs.select-evidence.outputs.reused != 'true' &&
      (needs.classify_profile.outputs.profile == 'release' ||
      needs.promotion-provenance.outputs.attested != 'true')
    name: ${{ needs.classify_profile.outputs.profile == 'release' && 'Release preflight (Python 3.13)' || 'CPU-only preflight (Python 3.13)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Strip feature-local state from promotion candidate
        if: inputs.strip_dev_state
        run: rm -rf .dev

      - name: Set up Python 3.13 with pip cache
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # GitHub-hosted runners have no GPU. Install the CPU wheel first so the
      # project's unpinned `torch` dependency is already satisfied. CI then
      # installs only the dependency surface required by the shared preflight
      # gates. Local `tox -e preflight` intentionally keeps `.[full]` for
      # developer machines.
      - name: Install CPU-only preflight environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[ci-preflight]"
          python -c "import torch; assert torch.version.cuda is None, f'GitHub preflight must use CPU-only torch, got CUDA {torch.version.cuda}'"
          python -c "import libtmux, lmdb, prompt_toolkit, sklearn; print('required preflight dependencies available')"

      - name: Run shared preflight gates in CI tox shell
        env:
          PROFILE: ${{ needs.classify_profile.outputs.profile }}
          RELEASE_BASE: ${{ needs.classify_profile.outputs.base_ref }}
          RELEASE_HEAD: ${{ github.sha }}
          RELEASE_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [[ "$PROFILE" == "release" ]]; then
            python -m tox run -e preflight-ci -- \
              --profile release \
              --release-base "$RELEASE_BASE" \
              --release-head "$RELEASE_HEAD" \
              --release-actor "$RELEASE_ACTOR"
          else
            python -m tox run -e preflight-ci -- --profile feature
          fi

  gate-result:
    if: always()
    needs: [classify_profile, promotion-provenance, select-evidence, preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful evidence or fresh gates
        env:
          EVIDENCE_RESULT: ${{ needs.select-evidence.result }}
          CLASSIFICATION_RESULT: ${{ needs.classify_profile.result }}
          PROVENANCE_RESULT: ${{ needs.promotion-provenance.result }}
          REUSED: ${{ needs.select-evidence.outputs.reused }}
          PROFILE: ${{ needs.classify_profile.outputs.profile }}
          ATTESTED: ${{ needs.promotion-provenance.outputs.attested }}
          FRESH_RESULTS: ${{ needs.preflight.result }}
        run: |
          set -euo pipefail
          [[ "$CLASSIFICATION_RESULT" == "success" ]] || exit 1
          [[ "$EVIDENCE_RESULT" == "success" ]] || exit 1
          [[ "$PROVENANCE_RESULT" == "success" ]] || exit 1
          if [[ "$REUSED" != "true" ]]; then
            if [[ "$PROFILE" == "feature" && "$ATTESTED" == "true" ]]; then
              exit 0
            fi
            [[ -n "$FRESH_RESULTS" ]] || exit 1
            for result in $FRESH_RESULTS; do
              [[ "$result" == "success" ]] || exit 1
            done
          fi
