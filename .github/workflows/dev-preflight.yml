name: Dev Preflight

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: preflight (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Run preflight
        run: tox run -e preflight
