name: Repository Governance

on:
  push:
    branches:
      - dev
      - main
      - 'feat/**'
      - 'feature/**'
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  workflow_dispatch:
    inputs:
      operation:
        description: Governed repository operation to run
        required: true
        type: choice
        options:
          - promote-dev-to-main

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository governance
        run: python3 scripts/checks/check_repository_governance.py

      - name: Enforce owner-only governance changes on push
        if: github.actor != 'kzhoa'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            changed="$(git diff-tree --no-commit-id --name-only -r "$AFTER")"
          else
            changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          fi

          protected='^(AGENTS\.md|\.github/CODEOWNERS|\.github/workflows/.*|scripts/checks/check_repository_governance\.py)$'
          if printf '%s\n' "$changed" | grep -Eq "$protected"; then
            echo "Only repository owner kzhoa may modify the protected governance surface."
            printf '%s\n' "$changed" | grep -E "$protected" || true
            exit 1
          fi

  preflight-feature-promotion:
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref_name, 'feat/') || startsWith(github.ref_name, 'feature/')) &&
      startsWith(github.event.head_commit.message, 'promote:')
    needs: validate-push
    permissions:
      contents: read
    uses: ./.github/workflows/dev-preflight.yml
    with:
      strip_dev_state: true

  promote-feature:
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref_name, 'feat/') || startsWith(github.ref_name, 'feature/')) &&
      startsWith(github.event.head_commit.message, 'promote:')
    needs:
      - validate-push
      - preflight-feature-promotion
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: feature-promotion-to-dev
      cancel-in-progress: false
    steps:
      - name: Verify owner promotion credential
        env:
          GH_TOKEN: ${{ secrets.OWNER_PROMOTION_TOKEN }}
          REQUEST_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          if [[ "$REQUEST_ACTOR" != "kzhoa" || "$TRIGGERING_ACTOR" != "kzhoa" ]]; then
            echo "Only repository owner kzhoa may request or rerun promotion."
            exit 1
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            echo "Configure OWNER_PROMOTION_TOKEN with Contents and Workflows write access to this repository."
            exit 1
          fi
          credential_owner="$(gh api user --jq .login)"
          if [[ "$credential_owner" != "kzhoa" ]]; then
            echo "OWNER_PROMOTION_TOKEN must authenticate as repository owner kzhoa."
            exit 1
          fi

      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.OWNER_PROMOTION_TOKEN }}

      - name: Prepare promotion
        id: prepare
        env:
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          git fetch origin dev
          dev_sha="$(git rev-parse origin/dev)"

          if ! git merge-base --is-ancestor "$dev_sha" HEAD; then
            echo "Feature branch is behind dev. Rebase/rebuild it on the current dev before promotion."
            exit 1
          fi

          protected='^(AGENTS\.md|\.github/CODEOWNERS|\.github/workflows/.*|scripts/checks/check_repository_governance\.py)$'
          if [[ "$ACTOR" != "kzhoa" ]] && git diff --name-only "$dev_sha"...HEAD | grep -Eq "$protected"; then
            echo "Only repository owner kzhoa may promote protected governance changes."
            git diff --name-only "$dev_sha"...HEAD | grep -E "$protected" || true
            exit 1
          fi

          rm -rf .dev
          git add -A
          tree_sha="$(git write-tree)"
          dev_tree="$(git rev-parse "$dev_sha^{tree}")"
          if [[ "$tree_sha" == "$dev_tree" ]]; then
            echo "Promotion contains no changes after stripping .dev/**."
            exit 1
          fi

          subject="$(printf '%s\n' "$HEAD_MESSAGE" | head -n 1)"
          squash_subject="${subject#promote:}"
          squash_subject="${squash_subject# }"
          if [[ -z "$squash_subject" ]]; then
            squash_subject="promote $BRANCH"
          fi

          git config user.name "qq"
          git config user.email "qq@x1q.cc"
          commit_sha="$(printf '%s\n\nPromoted-from: %s\n' "$squash_subject" "$BRANCH" | git commit-tree "$tree_sha" -p "$dev_sha")"

          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Advance dev with squash commit
        env:
          COMMIT_SHA: ${{ steps.prepare.outputs.commit_sha }}
        run: git push origin "$COMMIT_SHA:refs/heads/dev"

      - name: Delete promoted feature branch
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
        run: git push origin --delete "$BRANCH"

  validate-release-request:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'promote-dev-to-main'
    runs-on: ubuntu-latest
    steps:
      - name: Require dispatch from dev
        env:
          REQUEST_REF: ${{ github.ref_name }}
          REQUEST_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          if [[ "$REQUEST_ACTOR" != "kzhoa" || "$TRIGGERING_ACTOR" != "kzhoa" ]]; then
            echo "Only repository owner kzhoa may request or rerun promotion."
            exit 1
          fi
          if [[ "$REQUEST_REF" != "dev" ]]; then
            echo "Dev-to-main promotion must be dispatched with --ref dev."
            exit 1
          fi

  preflight-dev-release:
    needs: validate-release-request
    permissions:
      contents: read
    uses: ./.github/workflows/dev-preflight.yml

  artifact-e2e-dev-release:
    needs: validate-release-request
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  promote-dev-to-main:
    needs:
      - validate-release-request
      - preflight-dev-release
      - artifact-e2e-dev-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: dev-promotion-to-main
      cancel-in-progress: false
    steps:
      - name: Verify owner promotion credential
        env:
          GH_TOKEN: ${{ secrets.OWNER_PROMOTION_TOKEN }}
          REQUEST_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          if [[ "$REQUEST_ACTOR" != "kzhoa" || "$TRIGGERING_ACTOR" != "kzhoa" ]]; then
            echo "Only repository owner kzhoa may request or rerun promotion."
            exit 1
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            echo "Configure OWNER_PROMOTION_TOKEN with Contents and Workflows write access to this repository."
            exit 1
          fi
          credential_owner="$(gh api user --jq .login)"
          if [[ "$credential_owner" != "kzhoa" ]]; then
            echo "OWNER_PROMOTION_TOKEN must authenticate as repository owner kzhoa."
            exit 1
          fi

      - name: Check out validated dev commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.OWNER_PROMOTION_TOKEN }}

      - name: Fast-forward main to validated dev
        env:
          EXPECTED_DEV_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main dev
          main_sha="$(git rev-parse origin/main)"
          dev_sha="$(git rev-parse origin/dev)"

          if [[ "$dev_sha" != "$EXPECTED_DEV_SHA" ]]; then
            echo "Dev advanced while release gates were running; dispatch the promotion again."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$main_sha" "$dev_sha"; then
            echo "Main is not an ancestor of dev; refusing a non-fast-forward release."
            exit 1
          fi

          if [[ "$main_sha" == "$dev_sha" ]]; then
            echo "Main already points at the validated dev commit."
            exit 0
          fi

          git push origin "$dev_sha:refs/heads/main"

  inspect-pull-request:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce protected paths without checking out untrusted code
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const isProtected = (path) =>
              path === 'AGENTS.md' ||
              path === '.github/CODEOWNERS' ||
              path === 'scripts/checks/check_repository_governance.py' ||
              path.startsWith('.github/workflows/');

            const protectedChanges = files.filter((file) =>
              isProtected(file.filename) ||
              (file.previous_filename && isProtected(file.previous_filename))
            );

            if (protectedChanges.length > 0 && context.actor !== 'kzhoa') {
              core.setFailed(
                `Only repository owner kzhoa may modify protected governance files: ${protectedChanges
                  .map((file) => file.filename)
                  .join(', ')}`
              );
            }

            if (['dev', 'main'].includes(pr.base.ref)) {
              const devState = files.filter((file) =>
                file.filename === '.dev' ||
                file.filename.startsWith('.dev/') ||
                (file.previous_filename &&
                  (file.previous_filename === '.dev' || file.previous_filename.startsWith('.dev/')))
              );
              if (devState.length > 0) {
                core.setFailed('.dev/** is feature-local state and may not enter dev or main.');
              }
            }
