name: Fix dev preflight imports

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  fix-imports:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - name: Apply Ruff import fixes and remove this one-shot workflow
        run: |
          ruff check --fix \
            src/qqtools/plugins/qpipeline/runner/runner_utils/progress.py \
            tests/integration/functional/test_qpipeline/test_entry_utils_config_flow.py \
            tests/unit/plugins/qpipeline/test_scheduler_config.py
          git rm .github/workflows/fix-dev-preflight-imports.yml
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/qqtools/plugins/qpipeline/runner/runner_utils/progress.py \
            tests/integration/functional/test_qpipeline/test_entry_utils_config_flow.py \
            tests/unit/plugins/qpipeline/test_scheduler_config.py
          git commit -m "style: unblock dev preflight"
          git push origin HEAD:dev
