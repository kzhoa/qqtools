name: Installed Artifact E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  select-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      reused: ${{ steps.evidence.outputs.reused }}
    steps:
      - uses: actions/checkout@v4
      - name: Check exact-commit gate evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: artifact
          ALLOW_REUSE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: python3 scripts/ci/reuse_gate.py

  artifact-smoke:
    needs: select-evidence
    if: needs.select-evidence.outputs.reused != 'true'
    name: artifact smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip tox
      - run: tox run -e artifact-smoke

  artifact-e2e:
    needs: select-evidence
    if: needs.select-evidence.outputs.reused != 'true'
    name: artifact e2e (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip tox
      - run: tox run -e artifact-e2e

  gate-result:
    if: always()
    needs: [select-evidence, artifact-smoke, artifact-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful evidence or fresh gates
        env:
          EVIDENCE_RESULT: ${{ needs.select-evidence.result }}
          REUSED: ${{ needs.select-evidence.outputs.reused }}
          FRESH_RESULTS: ${{ needs.artifact-smoke.result }} ${{ needs.artifact-e2e.result }}
        run: |
          set -euo pipefail
          [[ "$EVIDENCE_RESULT" == "success" ]] || exit 1
          if [[ "$REUSED" != "true" ]]; then
            [[ -n "$FRESH_RESULTS" ]] || exit 1
            for result in $FRESH_RESULTS; do
              [[ "$result" == "success" ]] || exit 1
            done
          fi
