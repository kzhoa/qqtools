name: Installed Artifact E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  artifact-smoke:
    name: artifact smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip tox
      - run: tox run -e artifact-smoke

  artifact-e2e:
    name: artifact e2e (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip tox
      - run: tox run -e artifact-e2e
