[pytest]
cache_dir = tmp/.pytest_cache
pythonpath = src
testpaths = tests
python_files = test_*.py
norecursedirs = tests/e2e/qexp
addopts = --strict-markers
markers =
    integration: cross-module integration tests
    e2e: public-entry end-to-end tests
    slow: tests unsuitable for the fast local loop
    gpu: tests requiring a CUDA-capable environment
    ddp: distributed-process tests
